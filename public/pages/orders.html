<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Órdenes - CloudStore</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">☁️ CloudStore</a>
      <div class="nav-links">
        <a href="../">Inicio</a>
        <a href="products.html">Productos</a>
        <a href="cart.html">Carrito (<span id="cart-count">0</span>)</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <h2>Mis Órdenes</h2>
    <div id="orders-list"></div>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    window.supabaseClient = window.supabase.createClient('https://cloudstore-api.qallariy.lat', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0')
  </script>
  <script src="../js/auth.js"></script>
  <script>
    async function loadOrders() {
      const user = await getCurrentUser()
      if (!user) {
        document.getElementById('orders-list').innerHTML = '<p>Inicia sesión para ver tus órdenes.</p>'
        return
      }

      const { data: orders, error } = await supabaseClient
        .from('orders')
        .select('*, order_items(*)')
        .eq('comprador_id', user.id)
        .order('created_at', { ascending: false })

      if (error) {
        console.error(error)
        document.getElementById('orders-list').innerHTML = '<p>Error al cargar órdenes.</p>'
        return
      }

      if (!orders || orders.length === 0) {
        document.getElementById('orders-list').innerHTML = '<p>No tienes órdenes aún.</p>'
        return
      }

      document.getElementById('orders-list').innerHTML = orders.map(order => `
        <div class="order-card">
          <div class="order-header">
            <strong>Orden #${order.id.slice(0, 8)}</strong>
            <span class="order-status">${order.estado}</span>
            <span class="order-date">${new Date(order.created_at).toLocaleDateString()}</span>
          </div>
          <div class="order-items">
            ${order.order_items.map(item => `
              <div class="order-item">
                <span>${item.titulo} x${item.cantidad}</span>
                <span>$${(item.precio * item.cantidad).toFixed(2)}</span>
              </div>
            `).join('')}
          </div>
          <div class="order-total">
            <strong>Total: $${order.total}</strong>
          </div>
        </div>
      `).join('')
    }

    loadOrders()
  </script>
</body>
</html>
