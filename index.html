<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="CloudStore es el marketplace en la nube para comprar y vender productos de forma simple, rapida y segura. Descubre electronica, ropa, hogar y mucho mas." />
  <meta name="theme-color" content="#1aa971" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f7a57" />
